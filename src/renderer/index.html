<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>Open Model Listener</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/app.css">
</head>
<body class="app-shell">
  <main class="app-main">
    <h1 class="app-title">Open Model Listener</h1>
    <p class="app-subtitle">Configure your AI connection</p>

    <form id="config-form" class="config-form">
      <div class="form-group">
        <label class="form-label" for="api-key">API Key</label>
        <input
          type="password"
          id="api-key"
          class="form-input"
          placeholder="Enter your OpenRouter API key"
          autocomplete="off"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="model">Model</label>
        <input
          type="text"
          id="model"
          class="form-input"
          value="openai/gpt-oss-120b:free"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="reasoning">Reasoning Level</label>
        <select id="reasoning" class="form-select">
          <option value="None" selected>None</option>
          <option value="Low">Low</option>
          <option value="Medium">Medium</option>
          <option value="High">High</option>
          <option value="Ultra High">Ultra High</option>
        </select>
      </div>

      <p id="form-error" class="form-error" hidden></p>

      <button type="submit" class="btn btn-primary btn-block">Connect</button>
    </form>
  </main>
  <script type="module" src="scripts/app.js"></script>
</body>
</html>
